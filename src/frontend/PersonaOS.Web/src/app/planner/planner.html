<header class="toolbar">
  <button mat-flat-button class="create" data-testid="create-event" (click)="createEvent()">
    <mat-icon>add</mat-icon>
    Create
  </button>
  <button mat-stroked-button class="today" data-testid="today" (click)="goToday()" matTooltip="Today (T)">Today</button>
  <div class="steps">
    <button mat-icon-button [attr.aria-label]="'Previous ' + stepLabel()" [matTooltip]="'Previous ' + stepLabel()" data-testid="prev" (click)="step(-1)">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button mat-icon-button [attr.aria-label]="'Next ' + stepLabel()" [matTooltip]="'Next ' + stepLabel()" data-testid="next" (click)="step(1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
  <h1 class="title" data-testid="calendar-title">{{ title() }}</h1>
  <span class="spacer"></span>

  <button mat-stroked-button class="view-button" [matMenuTriggerFor]="viewMenu" data-testid="view-menu">
    {{ viewLabel() }}
    <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
  </button>
  <mat-menu #viewMenu="matMenu" xPosition="before" class="view-menu">
    @for (option of views; track option.view) {
      <button mat-menu-item (click)="setView(option.view)" [attr.data-testid]="'view-' + option.view">
        <span class="menu-row">
          <span>{{ option.label }}</span>
          <span class="key">{{ option.key }}</span>
        </span>
      </button>
    }
    <mat-divider />
    <button mat-menu-item (click)="$event.stopPropagation(); setOption('showWeekends')" data-testid="opt-weekends">
      <mat-icon>{{ options().showWeekends ? 'check' : '' }}</mat-icon>
      <span>Show weekends</span>
    </button>
    <button mat-menu-item (click)="$event.stopPropagation(); setOption('showSkipped')" data-testid="opt-skipped">
      <mat-icon>{{ options().showSkipped ? 'check' : '' }}</mat-icon>
      <span>Show skipped events</span>
    </button>
    <button mat-menu-item (click)="$event.stopPropagation(); setOption('showCompleted')" data-testid="opt-completed">
      <mat-icon>{{ options().showCompleted ? 'check' : '' }}</mat-icon>
      <span>Show completed events</span>
    </button>
  </mat-menu>
</header>

<div class="progress">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }
</div>

<section class="surface" [class.scrolls]="view() === 'year' || view() === 'schedule'">
  @switch (view()) {
    @case ('month') {
      <app-month-view
        [anchor]="anchor()"
        [itemsByDay]="itemsByDay()"
        [showWeekends]="options().showWeekends"
        (open)="openEvent($event)"
        (openDay)="openDay($event)"
        (create)="createEvent({ date: $event, start: null })"
      />
    }
    @case ('year') {
      <app-year-view [anchor]="anchor()" [itemsByDay]="itemsByDay()" (openDay)="openDay($event)" />
    }
    @case ('schedule') {
      <app-schedule-view [dates]="scheduleDays()" [itemsByDay]="itemsByDay()" (open)="openEvent($event)" (openDay)="openDay($event)" />
    }
    @default {
      <app-time-grid
        [days]="gridDays()"
        [itemsByDay]="itemsByDay()"
        (open)="openEvent($event)"
        (create)="createEvent($event)"
        (openDay)="openDay($event)"
      />
    }
  }
</section>
