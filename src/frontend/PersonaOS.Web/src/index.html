<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PersonaOS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- The browser's bar in the page's colour. ThemeService sets it to the page's own surface once
       the app runs; these cover the first paint. -->
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <!-- Applies a saved light/dark choice before the first paint, so a dark-mode user never sees a
       white flash while the app loads. ThemeService owns the choice after that. -->
  <script>
    try {
      var t = localStorage.getItem('personaos.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <!-- Material's own type and icon set. Self-hosting these is a later job; for a LAN app the
       cost is one cached request per device. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
