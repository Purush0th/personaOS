server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through here; keep in step with the API's 25 MB cap.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or
    # clients would keep loading a stale app after an upgrade.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Chat streams Server-Sent Events: buffering here would hold the whole
    # reply until completion and destroy the streaming UX.
    location /api/chat {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
