# PersonaOS — self-hosted personal AI assistant.
#
#   cp .env.example .env      # then edit it (JWT_SIGNING_KEY is required)
#   docker compose up -d
#   open http://localhost:8080  → the Setup Wizard
#
# No database service: PersonaOS uses embedded SQLite, so the whole stack is just
# the API + the web host. Everything persists in the `api-data` volume.
#
# Published images are used by default. To build from a source checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

name: personaos

services:
  api:
    image: ghcr.io/purush0th/personaos-api:${PERSONAOS_VERSION:-latest}
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      # The whole instance persists under /app/data (one volume):
      #   personaos.db        — the SQLite database (config, chat, goals, encrypted key)
      #   docs-storage/       — files attached to tasks and goals
      #   dp-keys/            — Data Protection keyring that decrypts the stored API key
      #   prompts/            — optional edits to the assistant's instructions (see README)
      # Back this volume up as a unit — the ciphertext (db) and its keyring live together.
      # See docs/BACKUP.md for the nightly backup job and off-host options.
      Database__Path: /app/data/personaos.db
      Documents__StoragePath: /app/data/docs-storage
      DataProtection__KeysPath: /app/data/dp-keys
      Prompts__OverridePath: /app/data/prompts
      # Nightly local snapshot (VACUUM INTO + docs + keyring). For real resilience,
      # mount Backup__Path on a SEPARATE volume/host path — see docs/BACKUP.md.
      Backup__Enabled: "true"
      Backup__Path: /app/data/backups
      # Where the API asks the updater (below) to install a release; without an updater it is unused.
      Updates__Path: /app/updates
      ASPNETCORE_ENVIRONMENT: Production
      # Push notifications are configured in the web app (Settings → Push notifications), by
      # uploading your own Firebase project's files. Nothing to set here.
    volumes:
      - api-data:/app/data
      - updates:/app/updates
      # Recommended: put backups on a different disk than api-data, e.g.
      # - /srv/personaos-backups:/app/data/backups
    expose:
      - "8080"
    restart: unless-stopped

  web:
    image: ghcr.io/purush0th/personaos-web:${PERSONAOS_VERSION:-latest}
    depends_on:
      - api
    # The only port published to the host. Bound to loopback by default so the
    # instance is reachable over Tailscale or a reverse proxy, not the open
    # internet. Set PERSONAOS_BIND=0.0.0.0 only if you know what you're doing.
    ports:
      - "${PERSONAOS_BIND:-127.0.0.1}:${PERSONAOS_PORT:-8080}:8080"
    restart: unless-stopped

  # --- Optional: your own speech service (profile "speech", off by default) ----------------
  # Speech-to-text (faster-whisper) and text-to-speech (Kokoro), both on an NVIDIA GPU, so the
  # phone can talk to the assistant and hear it answer without a cloud service.
  #   Turn on:   COMPOSE_PROFILES=speech in .env, then `docker compose up -d`
  #   Turn off:  remove that line, then `docker compose stop whisper kokoro`
  #   Or use OpenAI instead: leave the profile off and point Settings -> Speech service at
  #   https://api.openai.com/v1 with your key. Neither service publishes a port to the host;
  #   PersonaOS reaches them over the compose network. Needs the NVIDIA container toolkit
  #   (Docker Desktop on Windows has GPU support built in). See README "Voice".
  whisper:
    profiles: ["speech"]
    image: ghcr.io/purush0th/personaos-whisper:${PERSONAOS_VERSION:-latest}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
    volumes:
      - speech-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  kokoro:
    profiles: ["speech"]
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.0-cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # --- Optional: the model on this machine (profile "ollama", off by default) -----------------
  # Ollama in a container, reachable only over the compose network: in Settings → AI provider
  # choose Ollama with the address http://ollama:11434/v1. Fetch the model once:
  #   docker compose exec ollama ollama pull qwen2.5:3b-instruct
  # The settings fit a 6 GB card next to the speech service: one model loaded, one request at a
  # time, and a context cache at half the memory (flash attention, q8_0).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.3}
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # --- Optional: updates from the app (profile "updater", off by default; Linux) --------------
  # Lets Settings → Updates install a new release: the API asks, this container backs up the
  # data volume to ./backups, pulls the release, restarts, checks the API answers and rolls back
  # if it does not. It is the only service that can control Docker (the socket below), so it
  # publishes no port and accepts nothing but a version, through the `updates` volume.
  #   Turn on: add "updater" to COMPOSE_PROFILES in .env, and set PERSONAOS_DIR to this folder
  #            (it is mounted at the same path inside, so compose finds the same files).
  updater:
    profiles: ["updater"]
    image: ghcr.io/purush0th/personaos-updater:${PERSONAOS_VERSION:-latest}
    environment:
      PROJECT_DIR: ${PERSONAOS_DIR:-/opt/personaos}
      SELF_IMAGE: ghcr.io/purush0th/personaos-updater:${PERSONAOS_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updates:/updates
      - ${PERSONAOS_DIR:-/opt/personaos}:${PERSONAOS_DIR:-/opt/personaos}
    restart: unless-stopped

volumes:
  api-data:
  updates:
  speech-models:
  ollama-models:
