# PersonaOS — self-hosted personal AI assistant.
#
#   cp .env.example .env      # then edit it (JWT_SIGNING_KEY is required)
#   docker compose up -d
#   open http://localhost:8080  → the Setup Wizard
#
# No database service: PersonaOS uses embedded SQLite, so the whole stack is just
# the API + the web host. Everything persists in the `api-data` volume.
#
# Published images are used by default. To build from a source checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

name: personaos

services:
  api:
    image: ghcr.io/personaos/personaos-api:${PERSONAOS_VERSION:-latest}
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      # The whole instance persists under /app/data (one volume):
      #   personaos.db        — the SQLite database (config, chat, goals, encrypted key)
      #   docs-storage/       — uploaded document files
      #   dp-keys/            — Data Protection keyring that decrypts the stored API key
      # Back this volume up as a unit — the ciphertext (db) and its keyring live together.
      # See docs/BACKUP.md for the nightly backup job and off-host options.
      Database__Path: /app/data/personaos.db
      Documents__StoragePath: /app/data/docs-storage
      DataProtection__KeysPath: /app/data/dp-keys
      # Nightly local snapshot (VACUUM INTO + docs + keyring). For real resilience,
      # mount Backup__Path on a SEPARATE volume/host path — see docs/BACKUP.md.
      Backup__Enabled: "true"
      Backup__Path: /app/data/backups
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - api-data:/app/data
      # Recommended: put backups on a different disk than api-data, e.g.
      # - /srv/personaos-backups:/app/data/backups
    expose:
      - "8080"
    restart: unless-stopped

  web:
    image: ghcr.io/personaos/personaos-web:${PERSONAOS_VERSION:-latest}
    depends_on:
      - api
    # The only port published to the host. Bound to loopback by default so the
    # instance is reachable over Tailscale or a reverse proxy, not the open
    # internet. Set PERSONAOS_BIND=0.0.0.0 only if you know what you're doing.
    ports:
      - "${PERSONAOS_BIND:-127.0.0.1}:${PERSONAOS_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  api-data:
