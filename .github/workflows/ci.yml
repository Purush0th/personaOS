name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The build must stay at zero warnings; -warnaserror makes CI enforce it.
      - name: Build
        run: dotnet build PersonaOS.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test src/backend/PersonaOS.Tests -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/PersonaOS.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/PersonaOS.Web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/PersonaOS.Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  images:
    # Proves the container images still build; publishing happens in release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/backend/Dockerfile -t personaos-api:ci .
      - name: Build web image
        run: docker build -t personaos-web:ci src/frontend/PersonaOS.Web
      - name: Build updater image
        run: docker build -t personaos-updater:ci deploy/updater
      # The release workflow publishes this one too; a broken build would only show at release.
      - name: Build whisper image
        run: docker build -t personaos-whisper:ci deploy/speech/whisper

  updater:
    # The updater installs releases on people's servers: its backup, rollback and refusals are
    # tested against a stand-in docker and API (deploy/updater/test_updater.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest deploy/updater/test_updater.py
