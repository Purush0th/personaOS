name: Release

# Tag a release to publish it:  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Image names must be lowercase, and the owner is "Purush0th": every release up to
      # v0.1.0-alpha.8 failed here ("repository name must be lowercase").
      - name: Image namespace
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # QEMU + buildx so images are multi-arch — SQLite makes ARM (Raspberry Pi,
      # Apple Silicon) a first-class target, so publish for it too.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          # The API reports this version, and the update check compares it with the releases.
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-api:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: src/frontend/PersonaOS.Web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-web:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The speech service (compose profile "speech"): NVIDIA GPUs, so x86-64 only.
      - name: Build and push whisper
        uses: docker/build-push-action@v6
        with:
          context: deploy/speech/whisper
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-whisper:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-whisper:latest
          cache-from: type=gha,scope=whisper
          cache-to: type=gha,mode=max,scope=whisper

      # Applies a release from Settings → Updates (compose profile "updater").
      - name: Build and push updater
        uses: docker/build-push-action@v6
        with:
          context: deploy/updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-updater:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/personaos-updater:latest

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Every release must be signed with the same key, or the app cannot update itself: Android
      # refuses an update signed differently, and a runner's own debug key is new on every run.
      # The key lives in the repository's secrets (see README, "Signing the phone app").
      - name: Release signing key
        working-directory: src/frontend/PersonaOS.Mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets: without them the APK cannot update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      # The app's version is the release's, so the phone can tell it is behind.
      - name: Build release APK
        working-directory: src/frontend/PersonaOS.Mobile
        run: |
          flutter pub get
          flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: personaos-apk
          path: src/frontend/PersonaOS.Mobile/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [images, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: personaos-apk
          path: dist

      # Self-hosters upgrade by pulling the compose file, so ship it as an asset.
      - name: Stage release assets
        run: |
          cp deploy/docker-compose.yml deploy/.env.example deploy/import-data.sh dist/
          mv dist/app-release.apk dist/personaos-${GITHUB_REF_NAME}.apk

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/docker-compose.yml
            dist/.env.example
            dist/import-data.sh
            dist/personaos-*.apk
          body: |
            ## Install

            ```bash
            mkdir personaos && cd personaos
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.yml
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.example
            cp .env.example .env   # set JWT_SIGNING_KEY
            docker compose up -d
            ```

            Then open <http://localhost:8080> for the Setup Wizard. Runs on x86-64
            and ARM (Raspberry Pi, Apple Silicon). No database service — PersonaOS
            uses embedded SQLite; back up the `api-data` volume (see docs/BACKUP.md).

            ## Upgrade

            ```bash
            docker compose pull && docker compose up -d
            ```

            Migrations run automatically; your data and settings are preserved.
