name: Release

# Tag a release to publish it:  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/personaos-api:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/personaos-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: src/frontend/PersonaOS.Dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/personaos-dashboard:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/personaos-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build release APK
        working-directory: src/frontend/PersonaOS.Mobile
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: personaos-apk
          path: src/frontend/PersonaOS.Mobile/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [images, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: personaos-apk
          path: dist

      # Self-hosters upgrade by pulling the compose file, so ship it as an asset.
      - name: Stage release assets
        run: |
          cp deploy/docker-compose.yml deploy/.env.example dist/
          mv dist/app-release.apk dist/personaos-${GITHUB_REF_NAME}.apk

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/docker-compose.yml
            dist/.env.example
            dist/personaos-*.apk
          body: |
            ## Install

            ```bash
            mkdir personaos && cd personaos
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.yml
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.example
            cp .env.example .env   # set SA_PASSWORD and JWT_SIGNING_KEY
            docker compose up -d
            ```

            Then open <http://localhost:8080> for the Setup Wizard.

            ## Upgrade

            ```bash
            docker compose pull && docker compose up -d
            ```

            Migrations run automatically; your data and settings are preserved.
